name: DSU Autonomous Log Generator
on:
  schedule:
    - cron: '0 7 * * *'   # UTC 07:00 = 北京时间 15:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Daily Log
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: node scripts/generate-log.mjs

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "DSU Autonomous"
          git add logs/
          git commit -m "AUTONOMOUS_LOG: $(date +%Y-%m-%d)" || echo "No changes"
          git push
