name: DSU English Archive Backfill
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backfill English Archive
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: node scripts/backfill-en.mjs

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "DSU Autonomous"
          git add logs/
          git commit -m "EN_ARCHIVE_BACKFILL: $(date +%Y-%m-%d)" || echo "No changes"
          git push
